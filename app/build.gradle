plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// THIRD_PARTY_NOTICES ships inside the APK (Settings > Open-source licenses),
// copied from the repo root at build time so the file and the in-app screen
// cannot drift.
def noticesDir = layout.buildDirectory.dir('generated/notices')

// Release signing is optional: builds stay green without a keystore, and
// keystore.properties never enters version control.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.kinetica.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.kinetica.keyboard"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    sourceSets {
        main {
            assets.srcDirs += noticesDir
        }
    }

    if (keystorePropsFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            // Engine golden tests read the real dictionary and layout assets.
            includeAndroidResources = false
        }
    }
}

tasks.register('copyThirdPartyNotices', Copy) {
    from rootProject.file('THIRD_PARTY_NOTICES')
    into noticesDir
    rename { 'third_party_notices.txt' }
}
preBuild.dependsOn copyThirdPartyNotices

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
}
